PORT = 8080
JWT_SECRET = "your-jwt-secret-key"
TOKEN_EXPIRE = 60

[database]
HOST = "localhost"
PORT = 5432
USER = "your_db_user"
PASSWORD = "your_db_password"
NAME = "your_db_name"
SSL_MODE = "disable"
TABLE_PREFIX = "pkuphysu_"

[cors]
ALLOW_ORIGINS = ["http://localhost"]
ALLOW_METHODS = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
ALLOW_HEADERS = ["Origin", "Content-Type", "Accept", "Authorization"]

[log_config]
ENABLE = true
LEVEL = "info"
MAX_SIZE = 100
MAX_AGE = 30
MAX_BACKUPS = 7
COMPRESS = false
FILE_PATH = "./data/log/log.log"

[email]
HOST = "smtp.example.com"
PORT = 587
USERNAME = "your-email@example.com"
PASSWORD = "your-email-password"
FROM = "your-email@example.com"

[rate_limit]
REQUESTS_PER_SECOND = 10
BURST = 20
BLOCK_DURATION = 300

[moderation]
ENABLED = false
# true: 新帖子和评论先进入待审核状态，审核通过后才公开（先审后发）
# false: 不经过审核，发布即可见
REVIEW_REQUIRED = true
BASE_URL = "https://open.bigmodel.cn/api/paas/v4/moderations"
TOKEN = ""
SENSITIVE_WORDS = []
TIMEOUT = "5s"
RETRY_INTERVAL = "30s"
QUEUE_SIZE = 128
BATCH_SIZE = 20
REPORT_THRESHOLD = 3
